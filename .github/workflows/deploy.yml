name: Deploy Quartz site

on:
  push:
    branches:
      - v4   # your main working branch
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Setup Node.js (latest Quartz-compatible version)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24  # Latest Node.js 24.x

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build Quartz site
      - name: Build Quartz
        run: npx quartz build

      # 5️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public   # Quartz outputs to 'public'
          publish_branch: gh-pages  # Branch GitHub Pages will serve
